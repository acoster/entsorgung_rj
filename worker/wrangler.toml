name = "entsorgung-rj"
main = "src/entry.py"
compatibility_date = "2025-11-01"
compatibility_flags = ["python_workers"]

[[kv_namespaces]]
binding = "CACHE"
# Create with: npx wrangler kv namespace create CACHE
# then paste the returned id here.
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# How long a rendered calendar is served before refreshing from upstream.
CALENDAR_TTL_SECONDS = "14400"

# Python Workers only bundle modules under the entry's directory, so vendor the
# shared library package (from the repo root) in before every dev/deploy.
[build]
command = "rm -rf src/entsorgung_rj && cp -r ../entsorgung_rj src/entsorgung_rj && find src/entsorgung_rj -name __pycache__ -prune -exec rm -rf {} +"
watch_dir = ["src/entry.py", "../entsorgung_rj"]
